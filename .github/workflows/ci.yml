name: CI

on:
  push:
  pull_request:

jobs:
  validate-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: >
          python -c "import nbformat;
          nbformat.validate(nbformat.read('spotify_popularity_prediction.ipynb', 4))"
